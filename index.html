<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT to MP3 Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 20px;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .status-text {
      color: #38bdf8;
    }
    .error-text {
      color: #f87171;
    }
    .download-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 20px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>YT to MP3 Converter</h1>
    <p>Paste any YouTube video link to extract audio</p>

    <input type="text" id="ytUrl" placeholder="https://youtube.com/watch?v=..." />
    <button id="convertBtn" onclick="startDownload()">Convert to MP3</button>

    <div class="status-box" id="statusContainer"></div>
  </div>

  <script>
    const API_BASE = "https://yuki-api-rwq7.onrender.com";

    async function startDownload() {
      const urlInput = document.getElementById("ytUrl");
      const convertBtn = document.getElementById("convertBtn");
      const statusDiv = document.getElementById("statusContainer");
      const url = urlInput.value.trim();

      if (!url) {
        statusDiv.innerHTML = `<span class="error-text">Please enter a valid link!</span>`;
        return;
      }

      // UI state reset
      convertBtn.disabled = true;
      statusDiv.innerHTML = `<span class="status-text">Submitting request...</span>`;

      try {
        const response = await fetch(`${API_BASE}/download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url, format: "mp3" })
        });

        if (!response.ok) {
          throw new Error("Failed to start download task.");
        }

        const data = await response.json();
        const jobId = data.job_id;

        statusDiv.innerHTML = `<span class="status-text">Converting audio... (Please wait ~20-40s)</span>`;
        pollForFile(jobId);

      } catch (err) {
        statusDiv.innerHTML = `<span class="error-text">Error: ${err.message}</span>`;
        convertBtn.disabled = false;
      }
    }

    async function pollForFile(jobId) {
      const statusDiv = document.getElementById("statusContainer");
      const convertBtn = document.getElementById("convertBtn");
      const fileUrl = `${API_BASE}/file/${jobId}`;
      let attempts = 0;
      const maxAttempts = 30; // Max ~60 seconds wait

      const interval = setInterval(async () => {
        attempts++;
        try {
          const res = await fetch(fileUrl, { method: "HEAD" });

          if (res.ok) {
            clearInterval(interval);
            statusDiv.innerHTML = `
              <p style="color: #4ade80; margin-bottom: 5px;">Your MP3 is ready!</p>
              <a href="${fileUrl}" class="download-btn" download>Download MP3</a>
            `;
            convertBtn.disabled = false;
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            statusDiv.innerHTML = `<span class="error-text">Conversion timeout. Server is slow or video is too long.</span>`;
            convertBtn.disabled = false;
          }
        } catch (e) {
          if (attempts >= maxAttempts) {
            clearInterval(interval);
            statusDiv.innerHTML = `<span class="error-text">Failed to fetch file.</span>`;
            convertBtn.disabled = false;
          }
        }
      }, 2000);
    }
  </script>

</body>
</html>
