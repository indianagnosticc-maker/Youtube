<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT to MP3 Converter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #131b2e;
      padding: 30px 20px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      border: 1px solid #1e293b;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #090d16;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #38bdf8;
      color: #090d16;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #1e293b;
      color: #64748b;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 18px;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
    }
    .status-text {
      color: #38bdf8;
    }
    .error-text {
      color: #f87171;
      word-break: break-word;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 12px 22px;
      background: #22c55e;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>YT to MP3 Converter</h1>
    <p>Paste any YouTube link to convert & download MP3</p>

    <input type="text" id="ytUrl" placeholder="https://youtu.be/..." />
    <button id="convertBtn" onclick="startDownload()">Convert to MP3</button>

    <div class="status-box" id="statusContainer"></div>
  </div>

  <script>
    const API_BASE = "https://yuki-api-rwq7.onrender.com";

    async function startDownload() {
      const urlInput = document.getElementById("ytUrl");
      const convertBtn = document.getElementById("convertBtn");
      const statusDiv = document.getElementById("statusContainer");
      const rawUrl = urlInput.value.trim();

      if (!rawUrl) {
        statusDiv.innerHTML = `<span class="error-text">Please enter a valid YouTube link!</span>`;
        return;
      }

      convertBtn.disabled = true;
      statusDiv.innerHTML = `<span class="status-text">Starting server task...</span>`;

      try {
        const response = await fetch(`${API_BASE}/download`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: rawUrl, format: "mp3" })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || "Server rejected request.");
        }

        const data = await response.json();
        const jobId = data.job_id;

        statusDiv.innerHTML = `<span class="status-text">Converting audio... (wait ~20-40s)</span>`;
        pollForFile(jobId);

      } catch (err) {
        statusDiv.innerHTML = `<span class="error-text">Error: ${err.message}</span>`;
        convertBtn.disabled = false;
      }
    }

    async function pollForFile(jobId) {
      const statusDiv = document.getElementById("statusContainer");
      const convertBtn = document.getElementById("convertBtn");
      const fileUrl = `${API_BASE}/file/${jobId}`;
      let attempts = 0;
      const maxAttempts = 35; // ~70 seconds timeout

      const interval = setInterval(async () => {
        attempts++;
        try {
          // Check if file is available using GET
          const res = await fetch(fileUrl, { method: "GET" });

          if (res.status === 200) {
            clearInterval(interval);
            statusDiv.innerHTML = `
              <p style="color: #4ade80; margin-bottom: 6px;">Audio Ready!</p>
              <a href="${fileUrl}" class="download-btn" target="_blank" download="audio.mp3">Download MP3</a>
            `;
            convertBtn.disabled = false;
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            statusDiv.innerHTML = `<span class="error-text">Timeout: File taking too long or server failed.</span>`;
            convertBtn.disabled = false;
          }
        } catch (e) {
          if (attempts >= maxAttempts) {
            clearInterval(interval);
            statusDiv.innerHTML = `<span class="error-text">Network error while checking status.</span>`;
            convertBtn.disabled = false;
          }
        }
      }, 2000);
    }
  </script>

</body>
</html>
